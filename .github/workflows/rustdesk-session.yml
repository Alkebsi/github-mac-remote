name: 🦀 RustDesk Mac Session

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration (hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      macos_version:
        description: 'macOS version'
        required: true
        default: '14'
        type: choice
        options:
          - '14'
          - '15'
          - '26'
      runner_size:
        description: 'Runner size (standard=Free/Pro, large/xlarge=Team/Enterprise, intel=macOS 26 only)'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'large'
          - 'xlarge'
          - 'intel'
      unique_ip:
        description: 'Ensure unique IP via Cloudflare WARP VPN'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SESSION_DURATION: ${{ github.event.inputs.duration }}

jobs:
  mac-rustdesk-session:
    name: 🦀 Mac RustDesk Session (macOS ${{ github.event.inputs.macos_version }})
    runs-on: ${{ github.event.inputs.runner_size == 'xlarge' && format('macos-{0}-xlarge', github.event.inputs.macos_version) || github.event.inputs.runner_size == 'large' && format('macos-{0}-large', github.event.inputs.macos_version) || github.event.inputs.runner_size == 'intel' && github.event.inputs.macos_version == '26' && 'macos-26-intel' || format('macos-{0}', github.event.inputs.macos_version) }}
    timeout-minutes: 370
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Restore IP History Cache
        uses: actions/cache@v4
        with:
          path: .ip-history.json
          key: ip-history-${{ github.repository_owner }}
          restore-keys: |
            ip-history-

      - name: 🌐 Detect and Track IP
        run: |
          chmod +x scripts/ip-manager.sh
          ./scripts/ip-manager.sh

      - name: 🔒 Setup Unique IP (Cloudflare WARP)
        if: github.event.inputs.unique_ip == 'true'
        run: |
          chmod +x scripts/setup-warp.sh
          ./scripts/setup-warp.sh

      - name: 🔐 Create Admin User for GUI Authentication
        run: |
          # Create a new admin user that will appear in Users & Groups
          ADMIN_USER="yourname"
          echo "MAC_USER=${ADMIN_USER}" >> $GITHUB_ENV
          
          # Generate a secure password
          MAC_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)
          
          # Mask password in logs
          echo "::add-mask::${MAC_PASSWORD}"
          echo "MAC_PASSWORD=${MAC_PASSWORD}" >> $GITHUB_ENV
          
          echo "👤 Creating admin user: ${ADMIN_USER}"
          
          # Check if user already exists
          if id "${ADMIN_USER}" &>/dev/null; then
            echo "User ${ADMIN_USER} already exists, setting password..."
            sudo dscl . -passwd /Users/${ADMIN_USER} "" "${MAC_PASSWORD}" 2>/dev/null || \
            sudo sysadminctl -resetPasswordFor "${ADMIN_USER}" -newPassword "${MAC_PASSWORD}" 2>/dev/null || true
          else
            # Find a free UID (starting from 501 for regular users)
            LAST_UID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)
            NEW_UID=$((LAST_UID + 1))
            
            echo "   Creating user with UID: ${NEW_UID}"
            
            # Create the user
            sudo dscl . -create /Users/${ADMIN_USER}
            sudo dscl . -create /Users/${ADMIN_USER} UserShell /bin/zsh
            sudo dscl . -create /Users/${ADMIN_USER} RealName "Your Name"
            sudo dscl . -create /Users/${ADMIN_USER} UniqueID ${NEW_UID}
            sudo dscl . -create /Users/${ADMIN_USER} PrimaryGroupID 20
            sudo dscl . -create /Users/${ADMIN_USER} NFSHomeDirectory /Users/${ADMIN_USER}
            
            # Set password
            sudo dscl . -passwd /Users/${ADMIN_USER} "${MAC_PASSWORD}"
            
            # Add to admin group
            sudo dseditgroup -o edit -a ${ADMIN_USER} -t user admin
            
            # Create home directory
            sudo createhomedir -c -u ${ADMIN_USER} 2>/dev/null || sudo mkdir -p /Users/${ADMIN_USER}
            sudo chown -R ${ADMIN_USER}:staff /Users/${ADMIN_USER} 2>/dev/null || true
          fi
          
          # Verify user was created and is admin
          if id "${ADMIN_USER}" &>/dev/null; then
            echo "✅ User ${ADMIN_USER} created successfully"
            if dseditgroup -o checkmember -m "${ADMIN_USER}" admin 2>/dev/null; then
              echo "✅ User ${ADMIN_USER} is an admin"
            fi
          else
            echo "❌ Failed to create user"
          fi
          
          echo ""
          echo "   Use these credentials for System Settings:"
          echo "   User: ${ADMIN_USER}"
          echo "   Password: (in artifact file)"

      - name: 📊 System Information
        run: |
          chmod +x scripts/system-info.sh
          ./scripts/system-info.sh

      - name: 🎮 Install Parsec (for optional manual use)
        run: |
          chmod +x scripts/install-parsec.sh
          ./scripts/install-parsec.sh

      - name: 🦀 Setup RustDesk
        id: rustdesk
        run: |
          chmod +x scripts/setup-rustdesk.sh
          
          # Generate secure password
          RUSTDESK_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)
          
          # Mask password in GitHub Actions logs
          echo "::add-mask::${RUSTDESK_PASSWORD}"
          
          # Save as environment variable (masked)
          echo "RUSTDESK_PASSWORD=${RUSTDESK_PASSWORD}" >> $GITHUB_ENV
          
          # Export and run
          export RUSTDESK_PASSWORD
          ./scripts/setup-rustdesk.sh
          
          # Wait for RustDesk to register with relay servers
          sleep 10

      - name: 🔑 Get RustDesk ID
        shell: bash
        run: |
          set -euo pipefail

          RUSTDESK_CLI="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          RUSTDESK_ID=""

          for attempt in {1..12}; do
            if [[ -x "$RUSTDESK_CLI" ]]; then
              RUSTDESK_ID=$("$RUSTDESK_CLI" --get-id 2>/dev/null || true)
            fi

            if [[ -z "$RUSTDESK_ID" ]]; then
              CONFIG_DIR="$HOME/Library/Application Support/RustDesk"
              RUSTDESK_ID=$(cat "$CONFIG_DIR/id" 2>/dev/null || true)
            fi

            if [[ -n "$RUSTDESK_ID" && "$RUSTDESK_ID" != "Check_Logs" ]]; then
              echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"
              echo "RustDesk ID retrieved."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Could not retrieve the RustDesk ID."
          exit 1

      - name: 💾 Save Credentials (Private File)
        shell: bash
        run: |
          set -euo pipefail

          : "${MAC_USER:?MAC_USER was not set}"
          : "${MAC_PASSWORD:?MAC_PASSWORD was not set}"
          : "${RUSTDESK_PASSWORD:?RUSTDESK_PASSWORD was not set}"
          : "${RUSTDESK_ID:?RustDesk ID was not detected}"

          if [[ "$RUSTDESK_ID" == "Check_Logs" ]]; then
            echo "ERROR: RustDesk could not provide a connection ID."
            exit 1
          fi

          mkdir -p credentials

          cat > credentials/connection-info.txt <<EOF
          GITHUB MAC REMOTE - CREDENTIALS

          Started by: ${{ github.actor }}
          Date/Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Run ID: ${{ github.run_id }}

          Network Information:
          Public IP: ${CURRENT_IP:-Unknown}
          Location: ${IP_CITY:-Unknown}, ${IP_COUNTRY:-Unknown}
          Provider: ${IP_ORG:-Unknown}
          WARP VPN: ${WARP_ENABLED:-false}

          RustDesk Credentials:
          ID: $RUSTDESK_ID
          Password: $RUSTDESK_PASSWORD

          macOS Admin Credentials:
          User: $MAC_USER
          Password: $MAC_PASSWORD

          Use these credentials to connect to RustDesk and authenticate
          inside the temporary macOS session.

          SECURITY: This file must be encrypted before being uploaded.
          EOF

          echo "Credentials file created. Passwords are not printed."

      - name: 🔐 Encrypt Credentials Before Upload
        shell: bash
        env:
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
        run: |
          set -euo pipefail

          : "${AGE_RECIPIENT:?Set the AGE_RECIPIENT repository variable}"

          if [[ "$AGE_RECIPIENT" != age1* ]]; then
            echo "ERROR: AGE_RECIPIENT is not a valid age recipient."
            exit 1
          fi

          if ! command -v age >/dev/null 2>&1; then
            brew install age
          fi

          test -s credentials/connection-info.txt

          age --encrypt \
            --recipient "$AGE_RECIPIENT" \
            --output credentials/connection-info.txt.age \
            credentials/connection-info.txt

          test -s credentials/connection-info.txt.age

          rm -f credentials/connection-info.txt

          echo "Credentials encrypted successfully."
          echo "Plaintext credentials removed from the workspace."

      - name: 📦 Upload Encrypted Credentials Artifact
        uses: actions/upload-artifact@v4
        with:
          name: credentials-${{ github.actor }}-${{ github.run_id }}
          path: credentials/connection-info.txt.age
          if-no-files-found: error
          retention-days: 1


      - name: 📋 Connection Instructions
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "       GITHUB MAC REMOTE - READY"
          echo "=============================================="
          echo ""

          echo "Public IP: ${CURRENT_IP:-Unknown}"
          echo "Location: ${IP_CITY:-Unknown}, ${IP_COUNTRY:-Unknown}"

          if [[ "${WARP_ENABLED:-false}" == "true" ]]; then
            echo "VPN: Cloudflare WARP enabled"
          fi

          if [[ "${IP_IS_DUPLICATE:-false}" == "true" ]]; then
            echo "WARNING: This IP was previously used."
          fi

          echo ""
          echo "macOS user: ${MAC_USER:-Unknown}"
          echo "RustDesk ID and passwords: encrypted artifact only."
          echo ""
          echo "HOW TO CONNECT:"
          echo "1. Download the credentials artifact from this workflow run."
          echo "2. Decrypt connection-info.txt.age on your own computer."
          echo "3. Open RustDesk and enter the ID and password from that file."
          echo ""
          echo "SECURITY:"
          echo "The public repository may expose the encrypted artifact."
          echo "Only a holder of your matching private age key can decrypt it."
          echo ""
          echo "Session duration: ${SESSION_DURATION:-Unknown} hour(s)"
          echo ""

      - name: ⏱️ Keep Session Alive
        run: |
          chmod +x scripts/keep-alive.sh
          
          export DURATION_HOURS="${{ env.SESSION_DURATION }}"
          ./scripts/keep-alive.sh

      - name: 💾 Save IP History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ip-history.json
          key: ip-history-${{ github.repository_owner }}-${{ github.run_id }}
